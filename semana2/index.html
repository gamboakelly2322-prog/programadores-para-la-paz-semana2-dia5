<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Participa con tu propuesta</title>
</head>
<body>
  <main>
    <h1>Participa con tu propuesta para la comunidad</h1>
    <p>La info se usará solo para organización comunitaria.</p>

    <form>
      <label for="nombre">Nombre *</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="propuesta">Propuesta o mensaje *</label>
      <textarea id="propuesta" name="propuesta" required></textarea>

      <label for="contacto">Correo o teléfono (opcional)</label>
      <input type="text" id="contacto" name="contacto">

      <label>
        <input type="checkbox" name="consentimiento" required>
        Acepto el uso de mis datos para participación comunitaria.
      </label>

      <button type="submit">Enviar participación</button>
    </form>
  </main>
</body>
</html>
